[package]
name = "cstat-api"
description = "HTTP API server for cstat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
cstat-core = { path = "../cstat-core" }
cstat-ingest = { path = "../cstat-ingest" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
# Server-side OG card rendering (SVG -> PNG) for per-player social images.
# Only the `text` feature: we load a vendored DejaVu font explicitly
# (assets/fonts/), and our cards are pure vector + text — so default's
# `system-fonts` (OS font scan), `memmap-fonts`, and `raster-images`
# (gif/webp/jpeg decoders) are all dead weight on the build.
resvg = { version = "0.45", default-features = false, features = ["text"] }

[dev-dependencies]
serde_urlencoded = "0.7.1"

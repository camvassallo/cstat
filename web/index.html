<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />

    <!--
      Social-preview / SEO meta. Social unfurlers (X, Discord, Slack, iMessage,
      Facebook) don't run JS, so they only see this served <head> — not
      usePageTitle()'s per-route client-side title.

      STATIC block (same on every page) is below; the per-page-OVERRIDABLE block
      lives between the SSR_META markers and is replaced server-side for entity
      routes (/players/:id, /teams/:id, /coaches/:id) — see
      crates/cstat-api/src/routes/meta.rs and docs/seo_social_previews_plan.md.
      og:image must be an ABSOLUTE https URL to a real raster file
      (web/public/og-image.png, 1200x630 — SVG won't unfurl).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CamPom" />
    <meta property="og:image" content="https://campom.org/og-image.png" />
    <meta property="og:image:width" content="1424" />
    <meta property="og:image:height" content="752" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://campom.org/og-image.png" />

    <!--
      Per-page-overridable defaults. The server swaps everything between the
      markers for entity routes. Do NOT add a static rel=canonical to "/" here —
      it would tell Google every page duplicates the homepage; the per-page
      canonical is injected with the rest below.
    -->
    <!--SSR_META_START-->
    <title>CamPom — College Basketball Analytics</title>
    <meta name="description" content="College basketball analytics: KenPom-style team ratings, player projections and archetypes, RAPM/CamPom metrics, and game predictions." />
    <meta property="og:url" content="https://campom.org/" />
    <meta property="og:title" content="CamPom — College Basketball Analytics" />
    <meta property="og:description" content="KenPom-style ratings, player projections and archetypes, and game predictions." />
    <meta name="twitter:title" content="CamPom — College Basketball Analytics" />
    <meta name="twitter:description" content="KenPom-style ratings, player projections and archetypes, and game predictions." />
    <!--SSR_META_END-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

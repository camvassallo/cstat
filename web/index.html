<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon set. The mark is a square JPEG on its own navy field (no alpha),
      rasterized to PNG at build-prep time — see web/public/. PNG rather than
      the source JPEG because it's ~10x smaller at icon sizes and universally
      supported as an icon type.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the navbar's --brand-navy-deep so mobile browser chrome
         continues the header rather than cutting it off with a black band. -->
    <meta name="theme-color" content="#041f3f" />

    <!--
      Social-preview / SEO meta. Social unfurlers (X, Discord, Slack, iMessage,
      Facebook) don't run JS, so they only see this served <head> — not
      usePageTitle()'s per-route client-side title.

      STATIC block (same on every page) is below; the per-page-OVERRIDABLE block
      lives between the SSR_META markers and is replaced server-side for entity
      routes (/players/:id, /teams/:id, /coaches/:id) — see
      crates/cstat-api/src/routes/meta.rs and docs/seo_social_previews_plan.md.
      og:image must be an ABSOLUTE https URL to a real raster file. The default
      below is the static card (web/public/og-image.png); player pages swap it
      for a generated per-player card (/og/players/{id}.png) — which is why
      og:image + its dimensions live INSIDE the marker region.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Camalytics" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Per-page-overridable defaults. The server swaps everything between the
      markers for entity routes. Do NOT add a static rel=canonical to "/" here —
      it would tell Google every page duplicates the homepage; the per-page
      canonical is injected with the rest below.
    -->
    <!--SSR_META_START-->
    <title>Camalytics — College Basketball Analytics</title>
    <meta name="description" content="College basketball analytics: adjusted team ratings, CAM player valuation, projections, archetypes, lineups, and game predictions." />
    <meta property="og:url" content="https://campom.org/" />
    <meta property="og:title" content="Camalytics — College Basketball Analytics" />
    <meta property="og:description" content="Adjusted team ratings, CAM player valuation, projections and archetypes, and game predictions." />
    <meta property="og:image" content="https://campom.org/og-image.png" />
    <meta property="og:image:width" content="1424" />
    <meta property="og:image:height" content="752" />
    <meta name="twitter:title" content="Camalytics — College Basketball Analytics" />
    <meta name="twitter:description" content="Adjusted team ratings, CAM player valuation, projections and archetypes, and game predictions." />
    <meta name="twitter:image" content="https://campom.org/og-image.png" />
    <!--SSR_META_END-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

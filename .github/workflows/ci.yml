name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ── Rust ────────────────────────────────────────────────

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cstat
          POSTGRES_PASSWORD: cstat
          POSTGRES_DB: cstat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://cstat:cstat@localhost:5432/cstat_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # ── Training (Python) ───────────────────────────────────

  training-tests:
    name: Training Guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    env:
      # Deliberately unreachable. These guards have a database-free subset and
      # a database-backed subset; CI runs the former. Pointing at the `test`
      # job's Postgres service would be worse than useless — that database is
      # empty, so `_db_reachable()` would succeed and the frame checks would
      # then fail on missing tables rather than skip. The suite reports which
      # checks it skipped and why, so a silent no-op is visible in the log.
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches training/.venv, which is the environment requirements.txt
          # is pinned against and the one the #218 retrain will run in.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: training/requirements.txt
      # requirements.txt is a full lock (direct + transitive), so this also
      # verifies the pins still resolve — the pins are what make a model diff
      # attributable (#222). `--no-deps` would skip the resolver check, so
      # deliberately not used.
      - run: pip install -r requirements.txt
      # Source-level guards, no database required.
      - run: python test_no_oof_leak.py
      - run: python test_frame_determinism.py

  # ── Frontend ────────────────────────────────────────────

  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc -b --noEmit

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

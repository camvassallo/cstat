<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1424px; height:752px; overflow:hidden; }
  body {
    background:
      radial-gradient(120% 140% at 78% 22%, #0d4a8f 0%, rgba(13,74,143,0) 55%),
      linear-gradient(135deg, #031a35 0%, #052e5c 55%, #073b73 100%);
    font-family: 'Inter', system-ui, sans-serif;
    position: relative;
  }
  /* faint measurement grid, echoing the old card */
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 118px 118px;
  }
  .wrap {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 10px;
  }
  .mark { display:block; margin-top:-120px; margin-bottom:-138px; }
  .word {
    font-size: 128px; font-weight: 800; letter-spacing:-.035em;
    color:#fff; line-height:1;
  }
  .word em { font-style:normal; color:#8fc0e8; }
  .tag {
    font-size: 30px; font-weight: 600; letter-spacing:.16em;
    text-transform: uppercase; color:#7ea8cf;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <!-- The mark: white shooting arc, light-blue trajectory line with nodes,
         and the basketball — the same motif as the app icon, redrawn as
         vector so it composes on the gradient instead of sitting on its own
         opaque navy tile. -->
    <img class="mark" src="final_bare.svg" width="560" height="560" alt="">
    <div class="word">Cam<em>alytics</em></div>
    <div class="tag">College Basketball Analytics</div>
  </div>
</body>
</html>
